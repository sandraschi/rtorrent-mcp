name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format
        run: uv run ruff format src/ tests/ --check
      - name: Pyright
        run: uv run pyright src/
      - name: Pytest
        run: uv run pytest
      - name: Webapp deps
        working-directory: web_sota
        run: npm ci
      - name: tsc
        working-directory: web_sota
        run: npx tsc -b
      - name: Biome
        working-directory: web_sota
        run: npx biome ci .
