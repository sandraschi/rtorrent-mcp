name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  MCPB_VERSION: '1.1.1'

jobs:
  # Security and code quality checks
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black (code formatting)
        run: black --check --diff .

      - name: Run isort (import sorting)
        run: isort --check-only --diff .

      - name: Run mypy (type checking)
        run: mypy src/ --ignore-missing-imports

      - name: Run flake8 (linting)
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Comprehensive testing
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.txt[dev]

      - name: Run tests with coverage
        run: |
          pytest --cov=src/qbtmcp --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            .coverage
          retention-days: 30

  # Integration tests (optional, runs only on main/develop)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.txt[dev]

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  # Build and package
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [security, lint, test, integration]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && !failure()
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          npm install -g @anthropic-ai/mcpb@${{ env.MCPB_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=$(python -c "import datetime; print(datetime.datetime.now().strftime('%Y.%m.%d'))")
            TAG="latest"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            TAG="develop"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update version in files
        run: |
          # Update version in pyproject.toml
          sed -i "s/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          # Update version in src/qbtmcp/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ steps.version.outputs.version }}\"/" src/qbtmcp/__init__.py

      - name: Build Python package
        run: python -m build

      - name: Build MCPB package
        run: |
          cd dxt
          mcpb validate manifest.json
          cd ..
          ./scripts/build-dxt-package.ps1

      - name: Sign packages (if keys available)
        if: env.SIGNING_KEY
        run: |
          echo "Package signing not implemented in this workflow"
          # Future: Implement package signing with proper keys

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            dist/
            htmlcov/
          retention-days: 30

  # Create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') && !failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.version }}
          path: artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git history
          if command -v git-cliff &> /dev/null; then
            git-cliff --latest --strip all > CHANGELOG.md
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Release ${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## 🚀 RTorrent MCP Server ${{ needs.build.outputs.version }}

            ### 📦 Downloads
            - **MCPB Package**: `rtorrent-mcp-${{ needs.build.outputs.version }}.mcpb`
            - **Python Wheel**: `rtorrent_mcp-${{ needs.build.outputs.version }}-py3-none-any.whl`
            - **Source Distribution**: `rtorrent-mcp-${{ needs.build.outputs.version }}.tar.gz`

            ### 🔧 Installation
            1. Download the `.mcpb` file
            2. Drag it to Claude Desktop
            3. Configure rTorrent connection
            4. Restart Claude Desktop

            ### 📋 What's New
            ${{ steps.changelog.outputs.changelog }}

            ### 🔗 Links
            - [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            - [Issues](https://github.com/${{ github.repository }}/issues)
          files: |
            artifacts/dist/*.whl
            artifacts/dist/*.tar.gz
            artifacts/dist/*.mcpb
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to staging (optional)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging') && !failure()
    # environment: staging  # Commented out until environment is created
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your staging deployment commands here

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [release]
    if: (github.ref == 'refs/heads/main' && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')) || github.event.inputs.environment == 'production'
    # environment: production  # Commented out until environment is created
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your production deployment commands here

  # Publish to package registries
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && !failure()
    # environment: production  # Commented out until environment is created
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.version }}
          path: artifacts/

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN
        run: |
          pip install twine
          twine upload artifacts/dist/*.whl artifacts/dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish MCPB to Registry
        if: env.MCPB_REGISTRY_TOKEN
        run: |
          echo "Publishing to MCPB registry..."
          # Future: Implement MCPB registry publishing
        env:
          MCPB_REGISTRY_TOKEN: ${{ secrets.MCPB_REGISTRY_TOKEN }}

  # Update documentation
  docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && !failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install docs dependencies
        run: |
          pip install mkdocs mkdocs-material

      - name: Build documentation
        run: mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
