name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run twine check dist/*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build MCPB package
        run: |
          if command -v mcpb >/dev/null 2>&1; then
            cd dxt
            mcpb pack . ../dist/rtorrent-mcp.mcpb
            cd ..
          else
            echo "Creating fallback ZIP"
            mkdir -p dist
            cd dxt
            zip -r ../dist/rtorrent-mcp.mcpb . -x "*.git*" "*.pyc"
            cd ..
          fi

      - name: Generate changelog
        id: changelog
        run: |
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREVIOUS=$(git describe --tags --abbrev=0 HEAD^)
            LOG=$(git log --pretty=format:"- %s" $PREVIOUS..HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" --reverse)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${{ github.ref_name }}"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "version_number=${V#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: RTorrent MCP Server ${{ steps.version.outputs.version }}
          body: |
            ## RTorrent MCP Server ${{ steps.version.outputs.version }}
            
            ###  Downloads
            - **MCPB Package**: `rtorrent-mcp.mcpb` - Drag to Claude Desktop
            - **Python Wheel**: `rtorrent_mcp-${{ steps.version.outputs.version_number }}-py3-none-any.whl`
            - **Source Distribution**: `rtorrent-mcp-${{ steps.version.outputs.version_number }}.tar.gz`
            
            ### Installation
            1. Download the `.mcpb` file
            2. Drag it to Claude Desktop
            3. Configure rTorrent connection (localhost:5000)
            4. Restart Claude Desktop
            
            ### What's New
            ${{ steps.changelog.outputs.changelog }}
            
            ###  Links
            - [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            - [Issues](https://github.com/${{ github.repository }}/issues)
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') }}
          files: |
            dist/*.mcpb
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    # IMPORTANT: Only publish stable releases!
    if: |
      startsWith(github.ref, 'refs/tags/v') && 
      !contains(github.ref, 'alpha') && 
      !contains(github.ref, 'beta') && 
      !contains(github.ref, 'rc')
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
