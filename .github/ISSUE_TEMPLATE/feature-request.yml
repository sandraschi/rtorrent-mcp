name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] Brief description of the requested feature"
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ##  Feature Request

        Thank you for suggesting a new feature! Please fill out the template below to help us understand your idea.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief summary of the feature request.
      placeholder: "What's the feature you'd like to see?"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem/Use Case
      description: What problem does this feature solve? What use case would it address?
      placeholder: "Describe the problem this feature would solve or the use case it would enable."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: "Describe your proposed solution in detail."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions?
      placeholder: "Describe any alternative solutions or features you've considered."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important for my use case
        - Critical for my workflow
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Simple - Small changes, low risk
        - Medium - Moderate changes, some testing needed
        - Complex - Major changes, extensive testing required
        - Very Complex - Architectural changes, high risk
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples.
      placeholder: "Links, screenshots, mockups, or any other relevant information."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm you've considered these aspects
      options:
        - label: This feature doesn't already exist
        - label: I've searched for similar feature requests
        - label: This feature fits within the project's scope
        - label: I'm willing to contribute to implementing this feature
