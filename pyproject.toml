[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtorrent-mcp"
version = "1.0.0"
description = "RTorrent MCP Server - Austrian anime automation with FastMCP 2.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sandra's Austrian Anime Automation", email = "sandra@vienna.at"}
]
maintainers = [
    {name = "Sandra", email = "sandra@vienna.at"}
]
keywords = ["rtorrent", "anime", "mcp", "torrents", "austria", "asw", "fastmcp", "scgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Multimedia :: Video",
    "Framework :: FastMCP",
    "Typing :: Typed"
]
dependencies = [
    "fastmcp>=2.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "rtorrent-xmlrpc>=0.0.3",
    "psutil>=5.9.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.18"
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0"
]

docs = [
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.18"
]

[project.urls]
Homepage = "https://github.com/sandraschi/qbtmcp"
Documentation = "https://github.com/sandraschi/qbtmcp#readme"
Issues = "https://github.com/sandraschi/qbtmcp/issues"
Source = "https://github.com/sandraschi/qbtmcp"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qbtmcp*"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "pydantic_schema.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=qbtmcp",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]