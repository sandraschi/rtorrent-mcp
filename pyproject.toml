[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbtmcp"
version = "1.0.0"
description = "qBittorrent MCP Server - Austrian anime automation with FastMCP 2.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sandra's Austrian Anime Automation", email = "sandra@vienna.at"}
]
maintainers = [
    {name = "Sandra", email = "sandra@vienna.at"}
]
keywords = ["qbittorrent", "anime", "mcp", "torrents", "austria", "asw", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Multimedia :: Video",
    "Framework :: FastMCP",
    "Typing :: Typed"
]
dependencies = [
    "fastmcp[all]>=2.10.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.18"
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0"
]

docs = [
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.18"
]

[project.urls]
Homepage = "https://github.com/sandraschi/qbtmcp"
Documentation = "https://github.com/sandraschi/qbtmcp#readme"
Issues = "https://github.com/sandraschi/qbtmcp/issues"
Source = "https://github.com/sandraschi/qbtmcp"

[tool.setuptools]
package-dir = {"" = "src"}
packages = find:

[tool.setuptools.packages.find]
where = ["src"]
include = ["qbtmcp*"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "pydantic_schema.*"]
disallow_untyped_defs = false

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/sandra-vienna/qbtmcp"
Repository = "https://github.com/sandra-vienna/qbtmcp.git"
Issues = "https://github.com/sandra-vienna/qbtmcp/issues"
Documentation = "https://github.com/sandra-vienna/qbtmcp/blob/main/README.md"

[project.scripts]
qbtmcp = "qbtmcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qbtmcp*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["qbtmcp"]
omit = ["tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
